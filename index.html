<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="sidebar">
        <h2>Dashboard</h2>
        <a href="#">Profile</a>
        <a href="#">Statistics</a>
        <a href="#">Notifications</a>
        <a href="#">Settings</a>
    </div>

    <div class="dashboard">
        <div class="profile">
            <img src="billu.png" alt="Profile Picture">
            <div class="bio">
                <h2>Billu Sanda</h2>
                <p>BadmasSs</p>
            </div>
        </div>

        <div class="stats">
            <div class="stat">
                <h3>100M+</h3>
                <p>Followers</p>
            </div>
            <div class="stat">
                <h3>0</h3>
                <p>Following</p>
            </div>
            <div class="stat">
                <h3>99k+</h3>
                <p>Posts</p>
            </div>
        </div>

        <div class="notifications">
            <h2>Notifications</h2>
            <div class="notification">
                <img src="dawood.png" alt="Dawood Ibrahim">
                <p><strong>Dawood Ibrahim</strong> liked your post.</p>
            </div>
            <div class="notification">
                <img src="fbi.png" alt="FBI">
                <p><strong>FBI</strong> started following you.</p>
            </div>
            <div class="notification">
                <img src="manya.png" alt="Manya Surve">
                <p><strong>Manya Surve</strong> commented on your photo. "Bawaal"</p>
            </div>
        </div>
    </div>
</body>
</html>
